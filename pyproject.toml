[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vca-audited"
version = "0.1.0"
description = "Paper-based VCA core-method reimplementation"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.6.0", "diffusers==0.32.2", "transformers==4.48.3", "numpy==1.26.4", "pillow==11.1.0", "pyyaml==6.0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: requires downloaded pinned weights and a CUDA GPU"]
