[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vca-audited"
version = "0.1.0"
description = "Paper-based VCA core-method reimplementation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.6.0",
  "diffusers==0.32.2",
  "transformers==4.48.3",
  "huggingface-hub==0.28.1",
  "accelerate==1.3.0",
  "numpy==1.26.4",
  "pillow==11.1.0",
  "safetensors==0.5.2",
  "PyYAML==6.0.2",
  "psutil==6.1.1",
  "scikit-image==0.25.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]
metrics = [
  "torchvision==0.21.0",
  "lpips==0.1.4",
  "torch-fidelity==0.3.0",
]
local-llm = ["llama-cpp-python==0.3.36", "diskcache==5.6.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["gpu: requires downloaded pinned weights and a CUDA GPU"]
